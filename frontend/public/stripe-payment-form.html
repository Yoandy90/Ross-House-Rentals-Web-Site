<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pago Seguro - Ross Tax</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    
    body {
      background: #F9FAFB;
      padding: 20px;
      padding-top: 10px;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    
    /* Amount Card */
    .amount-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 24px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }
    
    .amount-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    
    .amount-value {
      font-size: 52px;
      color: white;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -2px;
    }
    
    .amount-subtext {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 500;
    }
    
    /* Card Container */
    .card-container {
      background: white;
      padding: 28px 24px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    
    .field-label {
      font-size: 15px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      display: block;
    }
    
    #card-element {
      padding: 16px;
      border: 2px solid #E5E7EB;
      border-radius: 14px;
      background: white;
      transition: all 0.3s ease;
      min-height: 50px;
    }
    
    #card-element.StripeElement--focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    #card-element.StripeElement--invalid {
      border-color: #EF4444;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
    }
    
    #card-errors {
      color: #EF4444;
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      font-weight: 500;
    }
    
    /* Loading/Error States */
    .loading-container, .error-container {
      text-align: center;
      padding: 40px 20px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text, .error-text {
      font-size: 16px;
      color: #6B7280;
      font-weight: 500;
    }
    
    .error-text {
      color: #EF4444;
    }
    
    /* Security Info */
    .security-info {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #DBEAFE 0%, #E0E7FF 100%);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      gap: 10px;
    }
    
    .security-text {
      font-size: 13px;
      color: #1E40AF;
      font-weight: 600;
      line-height: 1.5;
    }
    
    /* Pay Button */
    .pay-button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 20px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      letter-spacing: 0.3px;
    }
    
    .pay-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
    }
    
    .pay-button:active {
      transform: translateY(0);
    }
    
    .pay-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .pay-button-spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
    }
    
    /* Powered by Stripe */
    .powered-by {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 500;
    }
    
    .stripe-logo {
      color: #635BFF;
      font-weight: 800;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }
      
      .amount-value {
        font-size: 44px;
      }
      
      .card-container {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Loading State -->
    <div id="loading-state" class="loading-container">
      <div class="spinner"></div>
      <p class="loading-text">Iniciando pago seguro...</p>
    </div>
    
    <!-- Error State -->
    <div id="error-state" class="error-container" style="display: none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#EF4444" style="margin: 0 auto 16px;">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <p class="error-text" id="error-message">Error al inicializar el pago</p>
    </div>
    
    <!-- Payment Form -->
    <div id="payment-form" style="display: none;">
      <!-- Amount Display -->
      <div class="amount-card">
        <div class="amount-label">Total a pagar</div>
        <div class="amount-value" id="amount-display">$0.00</div>
        <div class="amount-subtext" id="credits-display">0 créditos</div>
      </div>
      
      <!-- Card Form -->
      <div class="card-container">
        <label class="field-label">Información de Tarjeta</label>
        <div id="card-element"></div>
        <div id="card-errors"></div>
      </div>
      
      <!-- Security Info -->
      <div class="security-info">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="#1E40AF">
          <path d="M10 2L3 6v5c0 4.42 3.17 8.13 7 9 3.83-.87 7-4.58 7-9V6l-7-4z"/>
          <path d="M9 12l-2-2 1-1 1 1 3-3 1 1-4 4z" fill="white"/>
        </svg>
        <span class="security-text">Tu información está protegida con encriptación de nivel bancario</span>
      </div>
      
      <!-- Pay Button -->
      <button id="pay-button" class="pay-button">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="white">
          <path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-9h2v5H9V7zm0 6h2v2H9v-2z"/>
        </svg>
        <span id="pay-button-text">Pagar $0.00</span>
      </button>
      
      <!-- Powered by Stripe -->
      <div class="powered-by">
        Procesado de forma segura por <span class="stripe-logo">Stripe</span>
      </div>
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const stripeKey = urlParams.get('stripeKey');
    const clientSecret = urlParams.get('clientSecret');
    const amount = parseFloat(urlParams.get('amount')) || 0;
    
    // DOM elements
    const loadingState = document.getElementById('loading-state');
    const errorState = document.getElementById('error-state');
    const errorMessage = document.getElementById('error-message');
    const paymentForm = document.getElementById('payment-form');
    const amountDisplay = document.getElementById('amount-display');
    const creditsDisplay = document.getElementById('credits-display');
    const payButton = document.getElementById('pay-button');
    const payButtonText = document.getElementById('pay-button-text');
    const cardErrors = document.getElementById('card-errors');
    
    // Show error
    function showError(message) {
      console.error('❌ Error:', message);
      loadingState.style.display = 'none';
      paymentForm.style.display = 'none';
      errorState.style.display = 'block';
      errorMessage.textContent = message;
      
      // Send error to app
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'PAYMENT_ERROR',
          error: message,
        }));
      }
    }
    
    // Show payment form
    function showPaymentForm() {
      loadingState.style.display = 'none';
      errorState.style.display = 'none';
      paymentForm.style.display = 'block';
    }
    
    // Initialize payment
    async function initializePayment() {
      try {
        console.log('🔄 Initializing payment...');
        console.log('Amount:', amount);
        console.log('Has Stripe key:', !!stripeKey);
        console.log('Has client secret:', !!clientSecret);
        
        // Validate parameters
        if (!stripeKey) {
          throw new Error('Falta la clave de Stripe');
        }
        
        if (!clientSecret) {
          throw new Error('Falta el client secret');
        }
        
        if (!amount || amount <= 0) {
          throw new Error('Monto inválido');
        }
        
        // Check if Stripe is loaded
        if (typeof Stripe === 'undefined') {
          throw new Error('Stripe.js no se cargó correctamente');
        }
        
        // Update display
        amountDisplay.textContent = `$${amount.toFixed(2)}`;
        creditsDisplay.textContent = `${Math.floor(amount)} créditos`;
        payButtonText.textContent = `Pagar $${amount.toFixed(2)}`;
        
        // Initialize Stripe
        console.log('✅ Initializing Stripe Elements...');
        const stripe = Stripe(stripeKey);
        const elements = stripe.elements();
        
        const style = {
          base: {
            color: '#374151',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            fontSize: '16px',
            fontWeight: '500',
            '::placeholder': {
              color: '#9CA3AF',
            },
          },
          invalid: {
            color: '#EF4444',
            iconColor: '#EF4444',
          },
        };
        
        const cardElement = elements.create('card', { 
          style,
          hidePostalCode: false,
        });
        
        cardElement.mount('#card-element');
        console.log('✅ Card element mounted');
        
        // Show form
        showPaymentForm();
        
        // Card validation
        cardElement.on('change', (event) => {
          if (event.error) {
            cardErrors.textContent = event.error.message;
          } else {
            cardErrors.textContent = '';
          }
        });
        
        // Pay button handler
        payButton.addEventListener('click', async () => {
          payButton.disabled = true;
          payButtonText.textContent = 'Procesando...';
          payButton.innerHTML = '<div class="pay-button-spinner"></div><span>Procesando pago...</span>';
          
          try {
            console.log('💳 Confirming payment...');
            const result = await stripe.confirmCardPayment(clientSecret, {
              payment_method: {
                card: cardElement,
              },
            });
            
            if (result.error) {
              console.error('❌ Payment error:', result.error);
              cardErrors.textContent = result.error.message;
              payButton.disabled = false;
              payButton.innerHTML = `<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-9h2v5H9V7zm0 6h2v2H9v-2z"/></svg><span>Pagar $${amount.toFixed(2)}</span>`;
              
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                  type: 'PAYMENT_ERROR',
                  error: result.error.message,
                }));
              }
            } else {
              console.log('✅ Payment successful!');
              payButton.innerHTML = '<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/></svg><span>¡Pago exitoso!</span>';
              
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                  type: 'PAYMENT_SUCCESS',
                  paymentIntent: result.paymentIntent,
                }));
              }
            }
          } catch (error) {
            console.error('❌ Unexpected error:', error);
            cardErrors.textContent = error.message || 'Error al procesar el pago';
            payButton.disabled = false;
            payButton.innerHTML = `<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-9h2v5H9V7zm0 6h2v2H9v-2z"/></svg><span>Pagar $${amount.toFixed(2)}</span>`;
            
            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'PAYMENT_ERROR',
                error: error.message || 'Error al procesar el pago',
              }));
            }
          }
        });
        
      } catch (error) {
        console.error('❌ Initialization error:', error);
        showError(error.message || 'Error al inicializar el pago');
      }
    }
    
    // Start initialization
    console.log('🚀 Starting payment form...');
    initializePayment();
  </script>
</body>
</html>
